# Self-healing locator configuration.
# Every key can be overridden per-run with a -D system property,
# e.g. mvn test -Dhealing.failOnHeal=true

# Master switch for the entire healing layer.
healing.enabled=true

# When true, a successful heal still fails the step with HealedLocatorException.
# Recommended: false for nightly regression, true for PR-gate jobs.
healing.failOnHeal=false

# Persistence locations (created if missing).
healing.cache.file=target/healing-cache.json
healing.report.file=target/healing-report.json

# ---- Phase 3 (reporting) ----
# One CSV row appended per suite run (healing-rate-per-release trend).
# Lives under target/, so it only accumulates within a single build unless
# your Jenkins job restores the previous run's copy first - see
# jenkins/Jenkinsfile.healing-notify.
healing.metrics.file=target/healing-metrics.csv

# Post a "N locators healed" summary to Slack/Teams at suite end when true.
# Call HealingReportPublisher.publish(HealingReporter.records(), config) from
# the same @AfterSuite hook that writes the report.
healing.report.webhook.enabled=false
healing.report.webhook.url=
# slack (default) | teams | teams-messagecard (legacy Office 365 connector)
healing.report.webhook.format=slack
healing.report.webhook.timeoutSeconds=10
healing.report.webhook.maxItems=20

# ---- Phase 2 (LLM healing) ----
# Requires: (1) healing.llm.enabled=true, (2) an engine passed to the
# SelfHealingElementLocator constructor - use LlmHealingEngineFactory.create(config)
# to build the right one from healing.llm.provider below without touching code.
healing.llm.enabled=false
healing.llm.provider=anthropic
healing.llm.confidence.threshold=0.7
healing.llm.timeoutSeconds=30
# Hard cap on pruned page-source characters sent per heal.
healing.llm.maxPageSourceChars=60000

# -- provider=anthropic (Claude Messages API, cloud) --
healing.llm.model=claude-sonnet-4-6
# Name of the environment variable that holds the API key. Never put the key
# itself in this file or anywhere in the repo.
healing.llm.apiKeyEnv=ANTHROPIC_API_KEY

# -- provider=ollama (local server, no API key) --
healing.llm.ollama.baseUrl=http://localhost:11434
healing.llm.ollama.model=llama3.1

# -- provider=vastai (self-hosted OpenAI-compatible server on rented GPU) --
# No default baseUrl - every rented instance has a different host/port.
healing.llm.vastai.baseUrl=
healing.llm.vastai.model=
healing.llm.vastai.apiKeyEnv=VASTAI_API_KEY
