# Android locator definitions.
#
# One block per locator key ("screen.element"):
#   <key>.description = human-readable description (drives deterministic /
#                        LLM healing keyword matching)
#   <key>              = <strategy>=<value>
#                        strategy is one of: id, accessibilityId, xpath,
#                        className, androidUIAutomator, iOSNsPredicate,
#                        iOSClassChain
#
# Keep keys in sync with locators_ios.properties - same key, same meaning,
# platform-specific strategy/value.

login.usernameField.description=Username entry field on the login screen
login.usernameField=id=com.td.app:id/username_input

login.passwordField.description=Password entry field on the login screen
login.passwordField=id=com.td.app:id/password_input

login.submitButton.description=Primary Sign In button on the login screen
login.submitButton=id=com.td.app:id/btn_login

accounts.summaryList.description=Accounts summary list on the home dashboard
accounts.summaryList=id=com.td.app:id/accounts_recycler

accounts.transferButton.description=Transfer money button on the accounts dashboard
accounts.transferButton=accessibilityId=transferMoney
